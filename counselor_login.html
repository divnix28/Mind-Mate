<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindMate | Counselor Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
                .glass-panel {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        }
        .animated-bg {
            background: linear-gradient(-45deg, #020617, #0f172a, #1e3a8a, #0f172a);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="animated-bg text-slate-100 min-h-screen font-sans flex items-center justify-center p-4">
        
    <div class="w-full max-w-md p-8 glass-panel rounded-2xl shadow-xl z-10 relative">
        <!-- Logo Header -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-blue-600 flex items-center justify-center mx-auto mb-4 shadow-[0_0_15px_rgba(37,99,235,0.5)]">
                <i class="ph ph-shield-check text-3xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white drop-shadow-md">Counselor Portal</h1>
            <p class="text-blue-300/80 text-sm mt-1">Secure Staff Authentication</p>
        </div>

        <!-- Alert Box -->
        <div id="alert-box" class="hidden mb-4 p-3 rounded-lg text-sm font-medium text-center transition-all"></div>

        <!-- Counselor Login Form -->
        <form id="login-form" onsubmit="handleCounselorLogin(event)">
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-blue-200/80 mb-1">Staff Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="ph ph-user text-blue-400"></i>
                        </div>
                        <input type="text" id="login-username" required class="w-full bg-slate-900/60 border border-blue-500/30 rounded-lg pl-10 pr-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-400/50 transition-colors backdrop-blur-sm" placeholder="e.g. counselor">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-blue-200/80 mb-1">Passcode</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="ph ph-lock-key text-blue-400"></i>
                        </div>
                        <input type="password" id="login-password" required class="w-full bg-slate-900/60 border border-blue-500/30 rounded-lg pl-10 pr-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-400/50 transition-colors backdrop-blur-sm" placeholder="••••••••">
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600/90 hover:bg-blue-500 text-white font-semibold hover:shadow-[0_0_20px_rgba(59,130,246,0.6)] transform hover:-translate-y-1 hover:scale-105 active:scale-95 transition-all duration-300 py-2.5 rounded-lg shadow-[0_0_15px_rgba(37,99,235,0.4)] hover:shadow-[0_0_25px_rgba(37,99,235,0.6)] transition-all mt-6 border border-blue-400/30">
                    Secure Login
                </button>
            </div>
            <div class="mt-6 text-center">
                <a href="/" class="text-xs text-blue-300/70 hover:text-blue-200 underline transition-colors">← Return to Student Portal</a>
            </div>
        </form>
    </div>

    <script>
        async function handleCounselorLogin(event) {
            event.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const alertBox = document.getElementById('alert-box');
            
            try {
                const response = await fetch('/counselor-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    alertBox.className = 'mb-4 p-3 rounded-lg text-sm font-medium text-center bg-emerald-100 text-emerald-800 border border-emerald-200';
                    alertBox.textContent = 'Success! Accessing secure dashboard...';
                    alertBox.classList.remove('hidden');
                    setTimeout(() => {
                        window.location.href = '/counselor-dashboard';
                    }, 800);
                } else {
                    alertBox.className = 'mb-4 p-3 rounded-lg text-sm font-medium text-center bg-red-100 text-red-800 border border-red-200';
                    alertBox.textContent = result.message || 'Invalid credentials';
                    alertBox.classList.remove('hidden');
                }
            } catch (error) {
                alertBox.className = 'mb-4 p-3 rounded-lg text-sm font-medium text-center bg-red-100 text-red-800 border border-red-200';
                alertBox.textContent = 'Network error. Please try again.';
                alertBox.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
