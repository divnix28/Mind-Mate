<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind-Mate Counselor Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --panel-bg-hover: #334155;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --border-color: #334155;
            --msg-counselor: #10b981;
            --msg-student: #3b82f6;
            --msg-system: rgba(245, 158, 11, 0.1);
            --msg-system-border: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar / Queue */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(135deg, rgba(59,130,246,0.1) 0%, rgba(139,92,246,0.1) 100%);
        }

        .sidebar-header h1 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .queue-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .queue-list::-webkit-scrollbar {
            width: 6px;
        }
        .queue-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }

        .queue-item {
            background-color: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .queue-item:hover {
            background-color: var(--panel-bg-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .queue-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .queue-badge {
            background-color: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 9999px;
            border: 1px solid rgba(245, 158, 11, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        .queue-info h3 {
            font-size: 0.95rem;
            margin-bottom: 4px;
        }

        .queue-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .btn-join {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }

        .btn-join:hover {
            background-color: var(--primary-hover);
        }

        /* Main Chat Area */
        .main-chat {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
            position: relative;
        }

        .empty-state {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: var(--text-muted);
            z-index: 10;
            background-color: var(--bg-color);
        }

        .empty-state.hidden {
            display: none;
        }

        .chat-header {
            padding: 20px 24px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header-info h2 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .chat-header-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .btn-sos {
            background: linear-gradient(135deg, var(--danger) 0%, #b91c1c 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 14px 0 rgba(239, 68, 68, 0.39);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-sos:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px 0 rgba(239, 68, 68, 0.5);
        }

        .btn-sos:active {
            transform: translateY(0);
        }

        .chat-messages {
            flex-grow: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-counselor {
            align-self: flex-end;
            background-color: var(--msg-counselor);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .msg-student {
            align-self: flex-start;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 2px;
        }

        .msg-system {
            align-self: center;
            background-color: var(--msg-system);
            border: 1px solid var(--msg-system-border);
            color: var(--msg-system-border);
            font-size: 0.85rem;
            text-align: center;
            max-width: 90%;
            border-radius: 8px;
            padding: 8px 16px;
        }

        .chat-input-container {
            padding: 20px 24px;
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color);
        }

        .chat-input-wrapper {
            display: flex;
            gap: 12px;
            background-color: var(--bg-color);
            padding: 8px 8px 8px 20px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            transition: border-color 0.2s;
        }

        .chat-input-wrapper:focus-within {
            border-color: var(--primary);
        }

        .chat-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            font-family: inherit;
            outline: none;
        }

        .send-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .send-btn:hover {
            background-color: var(--primary-hover);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            color: var(--danger);
        }

        .modal-header svg {
            width: 32px;
            height: 32px;
        }

        .modal-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }

        .data-item {
            background-color: rgba(15, 23, 42, 0.5);
            padding: 16px;
            border-radius: 8px;
            border-left: 4px solid var(--danger);
        }

        .data-item label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .data-item p {
            font-size: 1.1rem;
            font-weight: 500;
            color: white;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
        }

        .btn-close {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-close:hover {
            background-color: rgba(255,255,255,0.05);
        }
    </script>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h1>Emergency Queue</h1>
        </div>
        <div class="queue-list" id="queueList">
            <!-- Example dynamic queue item -->
            <div class="queue-item">
                <div class="queue-item-header">
                    <span class="queue-badge">AWAITING_COUNSELOR</span>
                </div>
                <div class="queue-info">
                    <h3>Session #89A2</h3>
                    <p>High Risk Detected - AI Handoff</p>
                </div>
                <button class="btn-join" onclick="joinSession('89A2')">Join Chat</button>
            </div>
            
            <div class="queue-item">
                <div class="queue-item-header">
                    <span class="queue-badge">AWAITING_COUNSELOR</span>
                </div>
                <div class="queue-info">
                    <h3>Session #B74F</h3>
                    <p>Self-harm keywords flagged</p>
                </div>
                <button class="btn-join" onclick="joinSession('B74F')">Join Chat</button>
            </div>
        </div>
    </div>

    <div class="main-chat">
        <div class="empty-state" id="emptyState">
            <svg style="width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
            </svg>
            <h2>Select a session from the queue to start.</h2>
        </div>

        <div class="chat-header hidden" id="chatHeader" style="display: none;">
            <div class="chat-header-info">
                <h2 id="activeSessionTitle">Session #---</h2>
                <p>Status: Connected securely</p>
            </div>
            <button class="btn-sos" id="sosBtn">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
                VERIFY EMERGENCY & DISPATCH
            </button>
        </div>

        <div class="chat-messages hidden" id="chatMessages" style="display: none;">
            <!-- Messages render here -->
        </div>

        <div class="chat-input-container hidden" id="chatInputArea" style="display: none;">
            <form class="chat-input-wrapper" id="chatForm">
                <input type="text" class="chat-input" id="messageInput" placeholder="Type your response to the student..." autocomplete="off" />
                <button type="submit" class="send-btn">
                    <svg style="width: 18px; height: 18px; fill: currentColor;" viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <!-- SOS Emergency Modal -->
    <div class="modal-overlay" id="sosModal">
        <div class="modal">
            <div class="modal-header">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
                <h2>Emergency Data Unmasked</h2>
            </div>
            <div class="data-grid">
                <div class="data-item">
                    <label>Student Name</label>
                    <p id="sosName">Loading...</p>
                </div>
                <div class="data-item">
                    <label>Location (Block & Room)</label>
                    <p id="sosLocation">Loading...</p>
                </div>
                <div class="data-item">
                    <label>Contact Number</label>
                    <p id="sosPhone">Loading...</p>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-close" onclick="closeSosModal()">Acknowledge & Close</button>
            </div>
        </div>
    </div>

    <script>
        let currentSessionId = null;
        let ws = null;

        const emptyState = document.getElementById('emptyState');
        const chatHeader = document.getElementById('chatHeader');
        const chatMessages = document.getElementById('chatMessages');
        const chatInputArea = document.getElementById('chatInputArea');
        const activeSessionTitle = document.getElementById('activeSessionTitle');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const sosBtn = document.getElementById('sosBtn');
        const sosModal = document.getElementById('sosModal');

        // Dynamic URL logic
        const wsProtocol = (window.location.protocol === 'https:') ? 'wss:' : 'ws:';
        const host = window.location.host || 'localhost:8000';

        function joinSession(sessionId) {
            currentSessionId = sessionId;
            
            // UI Toggle
            emptyState.style.display = 'none';
            chatHeader.style.display = 'flex';
            chatMessages.style.display = 'flex';
            chatInputArea.style.display = 'block';
            activeSessionTitle.textContent = `Session #${sessionId}`;
            
            // Clear previous messages
            chatMessages.innerHTML = '';
            
            // Connect to WebSocket
            if (ws) ws.close();
            
            const wsUrl = `${wsProtocol}//${host}/ws/counselor/${sessionId}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                addMessage('SYSTEM', `Connected to Session #${sessionId}`);
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    // Student messages are incoming to the counselor
                    if (data.sender === 'STUDENT' || data.sender === 'USER') {
                        addMessage('STUDENT', data.content);
                    } else if (data.sender === 'SYSTEM') {
                        addMessage('SYSTEM', data.content);
                    }
                } catch (e) {
                    console.error('Failed to parse message', e);
                }
            };

            ws.onclose = () => {
                addMessage('SYSTEM', 'Connection closed.');
            };

            ws.onerror = (error) => {
                console.error('WebSocket Error:', error);
            };
        }

        function addMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');
            
            if (sender === 'COUNSELOR') {
                msgDiv.classList.add('msg-counselor');
            } else if (sender === 'STUDENT') {
                msgDiv.classList.add('msg-student');
            } else if (sender === 'SYSTEM') {
                msgDiv.classList.add('msg-system');
            }

            msgDiv.textContent = text;
            chatMessages.appendChild(msgDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            if (ws && ws.readyState === WebSocket.OPEN) {
                // Counselor sends message to the backend which broadcasts to the student
                ws.send(JSON.stringify({ content: text }));
                addMessage('COUNSELOR', text);
                messageInput.value = '';
            } else {
                alert('Connection is offline.');
            }
        });

        // SOS Button Logic
        sosBtn.addEventListener('click', async () => {
            if (!currentSessionId) return;

            if (!confirm('Are you sure you want to verify emergency and unmask student data? This will alert campus security.')) {
                return;
            }

            // Open modal to show loading state
            sosModal.classList.add('active');
            
            try {
                // Post request using relative path per instructions
                const response = await fetch(`/api/v1/hitl/sos/unmask/${currentSessionId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    // Assuming data contains { name, block, roomNumber, phoneNumber }
                    document.getElementById('sosName').textContent = data.name || 'John Doe (Mocked)';
                    document.getElementById('sosLocation').textContent = `${data.block || 'Block A'} - ${data.roomNumber || 'Room 101'}`;
                    document.getElementById('sosPhone').textContent = data.phoneNumber || '+1 555-0198';
                } else {
                    document.getElementById('sosName').textContent = 'Error fetching data';
                    document.getElementById('sosLocation').textContent = 'Error fetching data';
                    document.getElementById('sosPhone').textContent = 'Error fetching data';
                }
            } catch (error) {
                console.error('SOS request failed:', error);
                document.getElementById('sosName').textContent = 'Network Error';
                document.getElementById('sosLocation').textContent = 'Network Error';
                document.getElementById('sosPhone').textContent = 'Network Error';
            }
        });

        function closeSosModal() {
            sosModal.classList.remove('active');
        }
    </script>
</body>
</html>
